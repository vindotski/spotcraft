#cloud-config
# First boot of a Spotcraft server (Debian 12/13 or Ubuntu 24.04+), apps or ops.
# A template: OpenTofu (infra/hetzner) fills in `role` (apps or ops) and `deploy_ssh_key`
# (the deploy key's public half) wherever they appear in dollar-brace placeholders. On another
# provider, replace those placeholders by hand and paste the result as the server's user data.

# Only key logins, and only as the deploy user.
disable_root: true
ssh_pwauth: false

users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${deploy_ssh_key}

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades

write_files:
  # Container logs rotate; containers keep running while the Docker daemon restarts.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }
  # Security updates install themselves; reboots stay manual.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Docker from Docker's own apt repository (signed), not a piped install script.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg" -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # The deploy user runs Compose (the docker group is root-equivalent: guard this key).
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy /opt/spotcraft
  # On the apps server the agent (uid 1000 in its image) writes app and site files.
  - if [ "${role}" = "apps" ]; then install -d -o 1000 -g 1000 /opt/spotcraft/apps /opt/spotcraft/sites; fi
  # Firewall: SSH and HTTP(S) from anywhere, everything from the private network.
  # Docker-published ports bypass ufw, which is why internal services bind to the private IP.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw allow from 10.0.0.0/16
  - ufw --force enable
  - echo "spotcraft ${role} server ready" > /var/log/spotcraft-ready
