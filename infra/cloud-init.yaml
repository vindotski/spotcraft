#cloud-config
# First boot of the Spotcraft server (Debian 12/13 or Ubuntu 24.04+).
# A template: OpenTofu (infra/hetzner) fills in `deploy_ssh_key` (the deploy key's public half)
# wherever it appears in a dollar-brace placeholder. On another provider, replace it by hand
# and paste the result as the server's user data.

# Only key logins, and only as the deploy user.
disable_root: true
disable_root_opts: >-
  no-port-forwarding,no-agent-forwarding,no-X11-forwarding,command="echo 'Log in as deploy, not root.';exit 142"
ssh_pwauth: false

users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${deploy_ssh_key}

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades

write_files:
  # Modern SSH algorithms only (the deploy script keeps this file in step on later deploys).
  - path: /etc/ssh/sshd_config.d/50-spotcraft.conf
    content: |
      # Managed by Spotcraft (infra/remote-deploy.sh and infra/cloud-init.yaml); edits are overwritten.
      # Modern algorithms only; Debian's defaults also offer NIST curves and SHA-1 MACs as fallbacks.
      KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
      PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  # Container logs rotate; containers keep running while the Docker daemon restarts.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }
  # Security updates install themselves; reboots stay manual.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Docker from Docker's own apt repository (signed), not a piped install script.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg" -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # The deploy user runs Compose (the docker group is root-equivalent: guard this key).
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy /opt/spotcraft
  # The agent (uid 1000 in its image) writes app and site files.
  - install -d -o 1000 -g 1000 /opt/spotcraft/apps /opt/spotcraft/sites
  # Firewall: SSH and HTTP(S) from anywhere.
  # Docker-published ports bypass ufw, which is why internal services bind to the private IP.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
  - systemctl reload ssh
  - echo "spotcraft server ready" > /var/log/spotcraft-ready
