# Apps server: Caddy in front, one container per hosted app, the Spotcraft agent,
# and exporters scraped by the ops server. Lives in /opt/spotcraft on the server.
# Only Caddy is public; everything else binds to the private-network address.
# Third-party images are pinned by digest; bump the version and digest together.
name: spotcraft-apps

services:
  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro # one file per app, written by the agent
      - caddy_data:/data # certificates: keep across redeploys
      - caddy_config:/config
    networks: [edge]

  agent:
    image: ${SPOTCRAFT_AGENT_IMAGE:-vindotski/spotcraft-agent}:${SPOTCRAFT_TAG:-latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      DATA_DIR: /opt/spotcraft
      CADDY_CONTAINER: spotcraft-apps-caddy-1
    # Reaches Docker through the socket's group instead of running as root.
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env (getent group docker)}"]
    ports:
      - "${PRIVATE_IP:?set PRIVATE_IP in .env}:4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same paths as on the host; owned by uid 1000 (the image's node user).
      - ./apps:/opt/spotcraft/apps # app.json + compose.yaml per app
      - ./sites:/opt/spotcraft/sites # Caddy site block per app

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    ports:
      - "${PRIVATE_IP}:9100:9100"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "${PRIVATE_IP}:8080:8080"
    volumes:
      - /:/rootfs:ro
      # Only the Docker socket (not all of /var/run): cAdvisor reads container names and labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker 29 keeps images in containerd, which cAdvisor needs to read container details.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

# Hosted apps join this network so Caddy can reach them by service name.
networks:
  edge:
    name: spotcraft-edge

volumes:
  caddy_data:
  caddy_config:
