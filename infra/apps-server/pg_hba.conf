# Who may log in to the apps server's Postgres (ADR 0015).
# The superuser only works over the container's local socket (the deploy script uses it to
# manage the agent's role). Everyone else, the agent and each app's role, logs in with a
# password; which database a role may open is decided by CONNECT privileges, not here.
# TYPE  DATABASE  USER      ADDRESS  METHOD
local   all       postgres           peer
local   all       all                reject
host    all       postgres  all      reject
host    all       all       all      scram-sha-256
