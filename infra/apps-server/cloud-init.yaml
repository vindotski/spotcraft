#cloud-config
# Apps server bootstrap for any Debian/Ubuntu VPS: Docker and a firewall.
# Placeholder skeleton.
package_update: true
packages:
  - ca-certificates
  - curl
  - ufw

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - mkdir -p /opt/spotcraft/apps /opt/spotcraft/sites
  # The agent runs as uid 1000 (the image's node user) and writes both folders.
  - chown 1000:1000 /opt/spotcraft/apps /opt/spotcraft/sites
  # Public: SSH and HTTP(S) only (Docker-published ports bypass ufw, hence the private-IP binds). Exporters and the agent listen on the private network.
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
