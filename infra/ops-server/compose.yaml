# Ops server: the Spotcraft dashboard plus monitoring. Lives in /opt/spotcraft.
# vmagent scrapes the apps server over the private network and probes the apps from
# outside (blackbox); VictoriaMetrics/VictoriaLogs store what the dashboard shows.
# Placeholder skeleton: images get pinned by digest when each service becomes real.
name: spotcraft-ops

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?set DASHBOARD_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  dashboard:
    image: ${SPOTCRAFT_DASHBOARD_IMAGE:-vindotski/spotcraft-dashboard}:${SPOTCRAFT_TAG:-latest}
    restart: unless-stopped
    environment:
      AGENT_URL: http://${APPS_PRIVATE_IP:?set APPS_PRIVATE_IP in .env}:4000
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?set DASHBOARD_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      VICTORIAMETRICS_URL: http://victoriametrics:8428
    volumes:
      - probes:/probes # uptime-probe targets the dashboard writes for vmagent
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=90d"]
    volumes:
      - vm_data:/storage

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
    ports:
      # Log shippers on the apps server push here over the private network.
      - "${OPS_PRIVATE_IP:?set OPS_PRIVATE_IP in .env}:9428:9428"
    volumes:
      - vl_data:/storage

  vmagent:
    image: victoriametrics/vmagent:v1.155.0
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vmagent/scrape.yaml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
    environment:
      APPS_PRIVATE_IP: ${APPS_PRIVATE_IP}
    volumes:
      - ./scrape.yaml:/etc/vmagent/scrape.yaml:ro
      - probes:/probes:ro

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped

volumes:
  probes:
  caddy_data:
  caddy_config:
  vm_data:
  vl_data:
