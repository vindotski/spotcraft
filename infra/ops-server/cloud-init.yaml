#cloud-config
# Ops server bootstrap for any Debian/Ubuntu VPS: Docker and a firewall.
# Placeholder skeleton.
package_update: true
packages:
  - ca-certificates
  - curl
  - ufw

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - mkdir -p /opt/spotcraft
  # Public: SSH and HTTP(S) only (Docker-published ports bypass ufw, hence the private-IP binds). VictoriaLogs listens on the private network.
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
