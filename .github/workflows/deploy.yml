name: Deploy

# Deploys Spotcraft itself (the agent, the dashboard, Postgres and the monitoring, all on one
# server, ADR 0026) at a published image tag. Hosted apps are deployed from the dashboard.
# Manual on purpose: pick the tag (latest, or sha-abc1234 to roll back).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the spotcraft image (latest, 0.4.0 or sha-abc1234)"
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.DASHBOARD_DOMAIN }}
    env:
      TAG: ${{ inputs.tag }}
      NAMESPACE: ${{ vars.DOCKERHUB_USERNAME || 'vindotski' }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
      APPS_DOMAIN: ${{ vars.APPS_DOMAIN }}
      # cloudflare: the server sits behind a Cloudflare Tunnel (ADR 0021); default direct.
      EDGE: ${{ vars.EDGE || 'direct' }}
      # Optional: the agent sets up custom domains' DNS (infra/cloudflare's agent_settings).
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APPS_ZONE_ID: ${{ vars.CLOUDFLARE_APPS_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      CLOUDFLARE_ACCESS_POLICY_ID: ${{ vars.CLOUDFLARE_ACCESS_POLICY_ID }}
      # Optional, both together: a Cloudflare Access sign-in skips the dashboard password.
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      # Optional, with the two BACKUP_* secrets: nightly backups (infra/cloudflare's backup_settings).
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $TAG"
            exit 1
          fi
          if [[ "$EDGE" != direct && "$EDGE" != cloudflare ]]; then
            echo "::error::EDGE must be direct or cloudflare"
            exit 1
          fi
          for name in SERVER_HOST DASHBOARD_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name variable on the production environment"
              exit 1
            fi
          done
          # Fail before touching a server if the image was never published.
          docker manifest inspect "$NAMESPACE/spotcraft:$TAG" > /dev/null

      # Plain ssh/scp, no third-party action. The host key is pinned via a secret, so a
      # man-in-the-middle can't impersonate the server.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            printf 'Host server\n  HostName %s\n' "$SERVER_HOST"
            printf 'Host *\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 15\n'
          } > ~/.ssh/config

      - name: Deploy the server
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          POSTGRES_AGENT_PASSWORD: ${{ secrets.POSTGRES_AGENT_PASSWORD }}
          DASHBOARD_PASSWORD_HASH: ${{ secrets.DASHBOARD_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
        run: |
          scp infra/server/compose.yaml infra/server/Caddyfile infra/server/pg_hba.conf \
            infra/server/scrape.yaml infra/server/blackbox.yml server:/opt/spotcraft/
          {
            printf 'export SPOTCRAFT_TAG=%q IMAGE_NAMESPACE=%q AGENT_TOKEN=%q\n' \
              "$TAG" "$NAMESPACE" "$AGENT_TOKEN"
            printf 'export DASHBOARD_DOMAIN=%q DASHBOARD_PASSWORD_HASH=%q SESSION_SECRET=%q\n' \
              "$DASHBOARD_DOMAIN" "$DASHBOARD_PASSWORD_HASH" "$SESSION_SECRET"
            printf 'export POSTGRES_AGENT_PASSWORD=%q APPS_DOMAIN=%q\n' "$POSTGRES_AGENT_PASSWORD" "$APPS_DOMAIN"
            printf 'export EDGE=%q CLOUDFLARE_TUNNEL_TOKEN=%q\n' "$EDGE" "$CLOUDFLARE_TUNNEL_TOKEN"
            printf 'export CLOUDFLARE_API_TOKEN=%q CLOUDFLARE_ACCOUNT_ID=%q CLOUDFLARE_APPS_ZONE_ID=%q CLOUDFLARE_TUNNEL_ID=%q\n' \
              "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_APPS_ZONE_ID" "$CLOUDFLARE_TUNNEL_ID"
            printf 'export CLOUDFLARE_ACCESS_POLICY_ID=%q\n' "$CLOUDFLARE_ACCESS_POLICY_ID"
            printf 'export CF_ACCESS_TEAM_DOMAIN=%q CF_ACCESS_AUD=%q\n' "$CF_ACCESS_TEAM_DOMAIN" "$CF_ACCESS_AUD"
            printf 'export BACKUP_S3_ENDPOINT=%q BACKUP_BUCKET=%q\n' "$BACKUP_S3_ENDPOINT" "$BACKUP_BUCKET"
            printf 'export BACKUP_ACCESS_KEY_ID=%q BACKUP_SECRET_ACCESS_KEY=%q\n' \
              "$BACKUP_ACCESS_KEY_ID" "$BACKUP_SECRET_ACCESS_KEY"
            cat infra/remote-deploy.sh
          } | ssh server bash -s

      # The login page, or, with Cloudflare Access in front, a redirect to Access's sign-in.
      - name: Check the dashboard from outside
        run: |
          check() {
            local result
            result="$(curl -s -o /tmp/page -w '%{http_code} %{redirect_url}' "https://$DASHBOARD_DOMAIN/login")" || return 1
            if [[ "$result" == "200 "* ]]; then
              grep -q 'Log in · Spotcraft' /tmp/page
            elif [[ "$result" =~ ^30[27]\ https://[a-z0-9-]+\.cloudflareaccess\.com/ ]]; then
              echo "Behind Cloudflare Access"
            else
              echo "Got: $result"
              return 1
            fi
          }
          for _ in $(seq 1 30); do
            check && break
            sleep 4
          done
          check
          echo "Spotcraft $TAG is live at https://$DASHBOARD_DOMAIN"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
