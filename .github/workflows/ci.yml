name: CI

# Pull requests: verify, and build both images (not pushed) so a broken Dockerfile shows
# before merging. main and v* tags: verify, then publish both images to Docker Hub.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The kit's database tests run against the same Postgres image as the apps server
    # (infra/apps-server/compose.yaml); keep the two in step.
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: ci-only-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KIT_TEST_POSTGRES_URL: postgres://postgres:ci-only-superuser@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:versions
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate compose files
        run: |
          for s in apps-server ops-server; do
            docker compose -f infra/$s/compose.yaml --env-file infra/$s/.env.example config --quiet
          done
      - name: Check the OpenTofu modules (format, validate)
        env:
          TOFU: ghcr.io/opentofu/opentofu:1.13.9@sha256:f5aef7f2632b490e3c289a239d7974497d0583f3df6bfa35e8eb31a367ee5ec0
        run: |
          for module in hetzner cloudflare; do
            docker run --rm -v "$PWD/infra:/infra" -w "/infra/$module" -e TF_DATA_DIR=/tmp/tf --entrypoint sh "$TOFU" \
              -c 'tofu fmt -check -diff && tofu init -backend=false -input=false -lockfile=readonly >/dev/null && tofu validate'
          done

  # Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN to push.
  images:
    name: Image (${{ matrix.image }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            dockerfile: agent/Dockerfile
            description: Spotcraft agent, deploys apps on the apps server
          - image: dashboard
            dockerfile: apps/dashboard/Dockerfile
            description: Spotcraft dashboard, manages and monitors the apps
          - image: site
            dockerfile: apps/site/Dockerfile
            description: The Spotcraft website (spotcraft.dev), hosted on Spotcraft
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release tag must match the root package.json version (bump it in the release commit).
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $version"
            exit 1
          fi

      # Builds run natively (--platform=$BUILDPLATFORM); only the small final stage of the
      # arm64 image needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main → latest; v1.2.3 → 1.2.3, 1.2 and 1 (no major tag for v0.x); every build → sha-abc1234.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || 'vindotski' }}/spotcraft-${{ matrix.image }}
          tags: |
            # main holds the production version; dev is the default branch, so not is_default_branch.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # No bare major tag before 1.0 (a "0" tag would mean nothing stable).
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=spotcraft-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/vindotski/spotcraft

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Scan what was just built (amd64, from the same cache): fail on HIGH/CRITICAL issues
      # that have a fix, so an update is waiting. Unfixable base-image CVEs don't block.
      - name: Load the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan/spotcraft-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Scan for fixable vulnerabilities
        env:
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          IMAGE: scan/spotcraft-${{ matrix.image }}:ci
        run: |
          docker save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            "$TRIVY" image --quiet --input /image.tar --ignorefile /.trivyignore.yaml \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  # Release tags only: publishes @spotcraft/kit and the CLI (`spotcraft`) to npm (ADR 0019),
  # after the same commit passed verify and built its images. Trusted publishing (GitHub
  # OIDC): no token is stored and provenance is automatic. NPM_TOKEN (environment `npm`) is
  # only for the very first publish, before a trusted publisher can be linked; delete it after.
  npm:
    name: npm packages
    needs: [verify, images]
    # Only the original repository publishes these names; forks of the template skip it.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'vindotski/spotcraft'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check the tag and npm
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $version"
            exit 1
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          npx --yes semver@7.7.3 -r '>=11.5.1' "$(npm --version)" > /dev/null || {
            echo "::error::npm $(npm --version) is too old for trusted publishing"
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spotcraft/kit --filter spotcraft build
      # npm doesn't know pnpm's workspace: protocol; the CLI depends on the kit's exact version.
      - run: node scripts/pin-workspace-deps.ts packages/cli
      - name: Publish (kit first, the CLI depends on it)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # With a token, ask for provenance explicitly; with OIDC it's automatic.
          extra=()
          [ -n "$NODE_AUTH_TOKEN" ] && extra=(--provenance)
          for dir in packages/kit packages/cli; do
            name="$(jq -r .name "$dir/package.json")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            (cd "$dir" && npm publish --access public --tag "$tag" "${extra[@]}")
          done
